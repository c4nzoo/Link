<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CANZO – Official Hub</title>
  <meta name="description" content="CANZO – Official Hub">
  <meta name="theme-color" content="#07080A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #07080A;
      --hair: rgba(255, 255, 255, 0.08);
      --accent: #CFE3F2;          /* Eisblau-Platin */
      --accent-soft: rgba(207, 227, 242, 0.14);
      --text: #E9EDF1;
      --muted: rgba(233, 237, 241, 0.45);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Langsamer radialer Lichtschimmer */
    .glow {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(40% 35% at 50% 38%, rgba(207, 227, 242, 0.09), transparent 70%),
        radial-gradient(30% 30% at 70% 75%, rgba(226, 208, 170, 0.05), transparent 70%);
      animation: drift 22s ease-in-out infinite alternate;
    }
    @keyframes drift {
      0%   { transform: translate3d(-3%, -2%, 0) scale(1); opacity: .85; }
      100% { transform: translate3d(3%, 3%, 0) scale(1.08); opacity: 1; }
    }

    /* Feines technisches Raster */
    .grid-lines {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 72px 72px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
              mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    }

    /* Rahmen-Ecken (HUD) */
    .corner {
      position: fixed;
      width: 22px;
      height: 22px;
      z-index: 1;
      pointer-events: none;
      border-color: rgba(255,255,255,0.14);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: calc(18px + env(safe-area-inset-top, 0px)); left: 18px; border-top-width: 1px; border-left-width: 1px; }
    .corner.tr { top: calc(18px + env(safe-area-inset-top, 0px)); right: 18px; border-top-width: 1px; border-right-width: 1px; }
    .corner.bl { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 18px; border-bottom-width: 1px; border-left-width: 1px; }
    .corner.br { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: 18px; border-bottom-width: 1px; border-right-width: 1px; }

    main {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(56px + env(safe-area-inset-top, 0px)) 24px calc(56px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }

    /* Titel */
    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      font-size: clamp(2.4rem, 11vw, 3.9rem);
      letter-spacing: 0.55em;
      margin: 0 -0.55em 0 0;   /* gleicht den Buchstabenabstand am Ende aus -> optisch zentriert */
      color: var(--text);
      text-shadow: 0 0 40px rgba(207, 227, 242, 0.12);
      animation: reveal 2.2s var(--ease) both;
    }
    @keyframes reveal {
      0%   { opacity: 0; filter: blur(14px); letter-spacing: 0.9em; }
      100% { opacity: 1; filter: blur(0);    letter-spacing: 0.55em; }
    }

    .hairline {
      width: 64px;
      height: 1px;
      margin: 28px 0 20px;
      background: linear-gradient(to right, transparent, rgba(207,227,242,0.5), transparent);
      animation: fade 2s 0.6s var(--ease) both;
    }

    /* Status */
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fade 2s 0.9s var(--ease) both;
    }
    .dot {
      position: relative;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.6s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: .6; }
      100% { transform: scale(3.4); opacity: 0; }
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Link-Liste */
    #links {
      width: 100%;
      max-width: 440px;
      margin-top: 52px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 22px;
      border: 1px solid var(--hair);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
      -webkit-backdrop-filter: blur(18px);
              backdrop-filter: blur(18px);
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      box-shadow: 0 10px 30px -18px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform 0.7s var(--ease), border-color 0.7s var(--ease), box-shadow 0.7s var(--ease), background 0.7s var(--ease);
      opacity: 0;
      animation: fade 1.4s var(--ease) forwards;
    }

    /* Lichtreflex */
    .link-btn::before {
      content: "";
      position: absolute;
      top: -50%;
      bottom: -50%;
      width: 38%;
      left: -60%;
      z-index: -1;
      transform: skewX(-22deg);
      background: linear-gradient(90deg, transparent, rgba(207,227,242,0.16), transparent);
      transition: left 1.1s var(--ease);
      pointer-events: none;
    }

    .link-btn .icon {
      width: 22px;
      text-align: center;
      font-size: 1.15rem;
      color: var(--accent);
      opacity: 0.9;
    }
    .link-btn .label {
      flex: 1;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }
    .link-btn .arrow {
      font-size: 0.8rem;
      color: var(--muted);
      transition: transform 0.7s var(--ease), color 0.7s var(--ease);
    }

    @media (hover: hover) {
      .link-btn:hover {
        transform: translateY(-2px);
        border-color: rgba(207, 227, 242, 0.3);
        background: linear-gradient(180deg, rgba(255,255,255,0.065), rgba(255,255,255,0.02));
        box-shadow: 0 18px 40px -20px rgba(0,0,0,1), 0 0 0 1px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,0.06);
      }
      .link-btn:hover::before { left: 130%; }
      .link-btn:hover .arrow { transform: translateX(6px); color: var(--accent); }
    }
    .link-btn:active,
    .link-btn:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(207, 227, 242, 0.3);
      outline: none;
    }
    .link-btn:active::before,
    .link-btn:focus-visible::before { left: 130%; }
